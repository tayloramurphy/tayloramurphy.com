<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="Taylor A Murphy. Engineer, Founder, Dad.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/syntax.css">
</head>
<body{% block body_attrs %}{% endblock %}>
<a class="skip" href="#main">Skip to content</a>
<canvas id="track" aria-hidden="true"></canvas>

<div class="page">
  <header class="site-head">
    <div class="wrap head-inner">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="5.5">
            <circle cx="43.5" cy="50.5" r="22"/>
            <circle cx="41" cy="53" r="11"/>
            <path d="M79.6 34.13 A34 34 0 1 1 59.28 15.86"/>
          </g>
          <circle cx="39.5" cy="54.5" r="4.5" fill="currentColor"/>
          <circle cx="72.04" cy="22.96" r="6" fill="currentColor"/>
        </svg>
        Taylor A Murphy
      </a>
      <p class="track-label" id="track-label"></p>
    </div>
  </header>

  <main id="main">
    {% block main %}{% endblock %}
  </main>

  <footer class="site-foot">
    <div class="wrap foot-inner">
      <p>© 2026 Taylor A Murphy</p>
      <ul class="foot-links">
        <li><a href="https://x.com/tamurphy">X</a></li>
        <li><a href="https://www.linkedin.com/in/tayloramurphy">LinkedIn</a></li>
        <li><a href="https://github.com/tayloramurphy">GitHub</a></li>
        <li><a href="https://tayloramurphy.substack.com/">Substack</a></li>
        <li><a href="https://starsystems.to/">STAR Systems</a></li>
      </ul>
    </div>
  </footer>
</div>
<script src="/track.js"></script>
</body>
</html>
